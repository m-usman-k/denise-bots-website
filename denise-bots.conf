server {
    server_name 13.212.150.216.traefik.me denisebots.com www.denisebots.com;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/denisebots.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/denisebots.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.denisebots.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = denisebots.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name 13.212.150.216.traefik.me denisebots.com www.denisebots.com;
    return 404; # managed by Certbot




}